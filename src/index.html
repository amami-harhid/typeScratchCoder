    <style>
        .container {
            width:80%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            opacity: 0.9;
        }
        div.element {
            background-color: #fafafa;
            border: 2px solid black;
        }
        div.element p {
            margin: 5px;
        }
        div.element button {
            font-size:large;
            background-color: #fafafa;
            border: none;
            color: #0000ff;
            text-align: left;
        }
        div.element button:hover {
            background-color: #fa0000;
            color: #ffffff;
        }
        div.element p p {
            font-size: small;
        }
    </style>
    <script>
        const getGuidance = async (path) => {
            return new Promise((resolve,reject)=>{
                fetch(`${path}guidance.json`).then(response=>{
                    if(!response.ok) 
                        reject('{<>}');
                    return response.json();
                }).then((data)=>{
                    resolve(data);
                }).catch((reason)=>{
                    reject();
                })
            });
        }
        const setup = async () => {
            const divGroups = document.querySelectorAll('div.group')
            for(const group of divGroups){
                const groupId = group.id;
                const testTargets = group.getAttribute('testTargets');
                if(testTargets){
                    const targets = testTargets.split(',');
                    const container = group.querySelector('.container');
                    for(const target of targets) {
                        const testName = target.padStart(3, '0');
                        // DIV作成
                        const div = document.createElement('div');
                        div.classList.add('element');
                        container.appendChild(div);
                        // Pタグ作成
                        const p = document.createElement('p');
                        p.id = `${testName}`;
                        div.appendChild(p);
                        const button = document.createElement('button');
                        const testPage = `/${groupId}/${testName}/`;
                        button.addEventListener('click', ()=>{
                            window.location.href = testPage;
                        });
                        try{
                            const json = await getGuidance(`${testPage}`);
                            if(json.title){
                                button.innerHTML = `${testName}:${json.title}`;
                                p.appendChild(button);
                                if(json.detail){
                                    const pDetail = document.createElement('p');
                                    pDetail.innerHTML = json.detail;
                                    p.appendChild(pDetail);
                                }
                            }else{
                                button.innerText = `${testName}`;
                                p.appendChild(button);
                            }
                        }catch(e){
                            // JSONファイルがない、中身が壊れている場合
                            button.innerText = `${testName}`;
                            p.appendChild(button);

                        }
                    }

                }

            }
        }
        const cssLog = () => {
            const style = document.createElement('style');
            const bgStyle = 
                `.transparent-bg {
                    position: relative;
                    z-index: 0; 
                 }
                 .transparent-bg::before {
                    content: "";
                    position: absolute;
                    top:0; bottom:0;
                    left:0; right:0;
                    background-image: url('${TypeScratcher}');
                    z-index: -1;
                    opacity:0.2;
                }`;
            style.innerHTML = bgStyle;
            const head = document.getElementsByTagName('head');
            head[0].appendChild(style);
        }
        window.onload = ()=>{
            setup();
        }
    </script>

        <div class="container">
        </div>
    </div>
    <div id="02_tryVarious" class="group" testTargets="1,2,3,4,5,6,7,8">
        <h2>Try Various things</h2>
        <div class="container">
        </div>
    </div>
    <div id="03_specials" class="group" testTargets="1">
        <h2>Specials</h2>
        <div class="container">
        </div>
    </div>
    <div id="04_sounds" class="group">
        <h2>音源</h2>

        <audio src="./Chill.wav" preload="auto" controls ></audio>

        cssLog();
